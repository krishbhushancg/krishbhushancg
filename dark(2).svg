<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">KRISH BHUSHAN — Developer Profile</title>
  <desc id="desc">Animated dark GitHub developer profile banner with terminal interface and cyber ASCII portrait.</desc>

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="bgGlow1"><stop offset="0%" stop-color="#7C3AED" stop-opacity=".26"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgGlow2"><stop offset="0%" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgGlow3"><stop offset="0%" stop-color="#10B981" stop-opacity=".16"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17233A" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#0B1222" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="ascii" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="48%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.8 0;0.8 0;-0.8 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feGaussianBlur stdDeviation="9" result="b2"/><animate attributeName="x" values="-20%;0%;-20%" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="-20%;0%;-20%" dur="7s" repeatCount="indefinite"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="clip"><rect x="12" y="12" width="1156" height="586" rx="28"/></clipPath>
    <mask id="fadeMask"><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="white"/><stop offset="88%" stop-color="white"/><stop offset="100%" stop-color="black"/></linearGradient><rect x="0" y="0" width="1180" height="610" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1180" height="610" rx="30" fill="#030712"/>
  <g clip-path="url(#clip)">
    <circle cx="90" cy="70" r="250" fill="url(#bgGlow1)"><animate attributeName="cx" values="90;170;90" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="540" r="250" fill="url(#bgGlow2)"><animate attributeName="cy" values="540;480;540" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="170" r="260" fill="url(#bgGlow3)"><animate attributeName="cx" values="1120;1050;1120" dur="16s" repeatCount="indefinite"/></circle>

    <g opacity=".55">
      <circle cx="75" cy="130" r="2.5" fill="#22D3EE"><animateMotion path="M0 0 45 25 0 60 -30 30Z" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="570" cy="80" r="2" fill="#7C3AED"><animateMotion path="M0 0 -30 45 20 80Z" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="520" r="2.5" fill="#10B981"><animateMotion path="M0 0 40 -30 -20 -70Z" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="520" r="2" fill="#22D3EE"><animateMotion path="M0 0 -50 -40 10 -90Z" dur="9s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="28" y="28" width="1124" height="554" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="1.2"/>
    <rect x="30" y="30" width="1120" height="550" rx="23" fill="none" stroke="#fff" stroke-opacity=".04">
      <animate attributeName="stroke-opacity" values=".02;.12;.02" dur="4s" repeatCount="indefinite"/>
    </rect>

