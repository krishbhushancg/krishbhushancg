        <text x="10" y="356">&gt; status: <tspan fill="#10B981">ONLINE</tspan></text>
        <text x="10" y="377">&gt; mode: <tspan fill="#22D3EE">BUILD</tspan><tspan fill="#7C3AED">_CREATE</tspan></text>
      </g>
      <rect x="10" y="395" width="210" height="1" fill="url(#accent)" opacity=".5"/>
    </g>

    <!-- Terminal -->
    <g transform="translate(350 64)">
      <rect x="0" y="0" width="790" height="480" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".09"/>
      <rect x="1" y="1" width="788" height="478" rx="21" fill="none" stroke="url(#accent)" stroke-opacity=".35">
        <animate attributeName="stroke-opacity" values=".18;.55;.18" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="790" height="58" rx="22" fill="#fff" fill-opacity=".025"/>
      <circle cx="28" cy="29" r="5.5" fill="#7C3AED"/><circle cx="47" cy="29" r="5.5" fill="#22D3EE"/><circle cx="66" cy="29" r="5.5" fill="#10B981"/>
      <text x="735" y="34" text-anchor="end" font-family="monospace" font-size="12" fill="#64748B">~/profile</text>
      <rect x="22" y="57" width="746" height="1" fill="#fff" fill-opacity=".06"/>

      <g font-family="monospace">
        <text x="30" y="100" font-size="25" font-weight="700" fill="#F8FAFC">Hi 👋 I'm <tspan fill="url(#accent)">KRISH BHUSHAN</tspan><tspan fill="#22D3EE">|</tspan>
          <animate attributeName="opacity" values="0;1" dur=".7s" begin=".3s" fill="freeze"/>
        </text>
        <g fill="#CBD5E1" font-size="14">
          <text x="30" y="132">&gt; <tspan fill="#22D3EE">Frontend Engineer</tspan></text>
          <text x="30" y="157">&gt; <tspan fill="#7C3AED">Full Stack Developer</tspan></text>
          <text x="30" y="182">&gt; <tspan fill="#10B981">Open Source Contributor</tspan></text>
