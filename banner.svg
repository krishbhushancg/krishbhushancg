<svg width="1200" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="250" fill="url(#bgGrad)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.25">
    <circle cx="80" cy="40" r="2" fill="#00F5FF"/>
    <circle cx="140" cy="60" r="2" fill="#00F5FF"/>
    <circle cx="200" cy="30" r="2" fill="#8A2BE2"/>
    <circle cx="1080" cy="200" r="2" fill="#00F5FF"/>
    <circle cx="1120" cy="160" r="2" fill="#8A2BE2"/>
    <circle cx="1000" cy="220" r="2" fill="#00F5FF"/>
    <circle cx="60" cy="210" r="2" fill="#8A2BE2"/>
    <circle cx="110" cy="190" r="2" fill="#00F5FF"/>
  </g>

  <!-- Glow accent circles -->
  <circle cx="1000" cy="60" r="120" fill="url(#dotGrad)"/>
  <circle cx="180" cy="200" r="100" fill="url(#dotGrad)"/>

  <!-- Angle bracket accents -->
  <text x="60" y="150" font-family="Fira Code, monospace" font-size="40" fill="#8A2BE2" opacity="0.5">&lt;</text>
  <text x="1120" y="150" font-family="Fira Code, monospace" font-size="40" fill="#8A2BE2" opacity="0.5">/&gt;</text>

  <!-- Main title -->
  <text x="600" y="115" font-family="Fira Code, monospace" font-size="58" font-weight="700"
        text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)">
    KRISH BHUSHAN
  </text>

  <!-- Subtitle -->
  <text x="600" y="160" font-family="Fira Code, monospace" font-size="22"
        text-anchor="middle" fill="#c9d1d9" letter-spacing="2">
    &lt; Full-Stack Developer /&gt;
  </text>

  <!-- Bottom tag line -->
  <text x="600" y="200" font-family="Fira Code, monospace" font-size="16"
        text-anchor="middle" fill="#00F5FF" opacity="0.85">
    HTML • CSS • JavaScript • Python
  </text>
</svg>
