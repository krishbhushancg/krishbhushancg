<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">KRISH BHUSHAN — Developer Profile</title>
  <desc id="desc">Animated dark GitHub developer profile banner with terminal interface and cyber ASCII portrait.</desc>

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="bgGlow1"><stop offset="0%" stop-color="#2563EB" stop-opacity=".12"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgGlow2"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".10"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgGlow3"><stop offset="0%" stop-color="#10B981" stop-opacity=".08"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#EEF2FF" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="ascii" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="48%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.8 0;0.8 0;-0.8 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feGaussianBlur stdDeviation="9" result="b2"/><animate attributeName="x" values="-20%;0%;-20%" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="-20%;0%;-20%" dur="7s" repeatCount="indefinite"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="clip"><rect x="12" y="12" width="1156" height="586" rx="28"/></clipPath>
    <mask id="fadeMask"><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="white"/><stop offset="88%" stop-color="white"/><stop offset="100%" stop-color="black"/></linearGradient><rect x="0" y="0" width="1180" height="610" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1180" height="610" rx="30" fill="#FFFFFF"/>
  <g clip-path="url(#clip)">
    <circle cx="90" cy="70" r="250" fill="url(#bgGlow1)"><animate attributeName="cx" values="90;170;90" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="540" r="250" fill="url(#bgGlow2)"><animate attributeName="cy" values="540;480;540" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="170" r="260" fill="url(#bgGlow3)"><animate attributeName="cx" values="1120;1050;1120" dur="16s" repeatCount="indefinite"/></circle>

    <g opacity=".55">
      <circle cx="75" cy="130" r="2.5" fill="#22D3EE"><animateMotion path="M0 0 45 25 0 60 -30 30Z" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="570" cy="80" r="2" fill="#7C3AED"><animateMotion path="M0 0 -30 45 20 80Z" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="520" r="2.5" fill="#10B981"><animateMotion path="M0 0 40 -30 -20 -70Z" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="520" r="2" fill="#22D3EE"><animateMotion path="M0 0 -50 -40 10 -90Z" dur="9s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="28" y="28" width="1124" height="554" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="1.2"/>
    <rect x="30" y="30" width="1120" height="550" rx="23" fill="none" stroke="#fff" stroke-opacity=".04">
      <animate attributeName="stroke-opacity" values=".02;.12;.02" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Left ASCII -->
    <g transform="translate(48 72)">
      <text x="0" y="0" fill="#22D3EE" font-family="monospace" font-size="13" letter-spacing="2">&gt; CODE / BUILD / REPEAT</text>
      <g transform="translate(0 48)" font-family="monospace" font-size="11.5" font-weight="700" fill="url(#ascii)" filter="url(#soft)" mask="url(#fadeMask)">
        <text x="0" y="0" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>              .-::::::::::::-.</text>
        <text x="0" y="15" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.45s" fill="freeze"/>          .:+################+:.</text>
        <text x="0" y="30" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>        :*####################*:</text>
        <text x="0" y="45" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.95s" fill="freeze"/>      .=########################=.</text>
        <text x="0" y="60" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>     :############################:</text>
        <text x="0" y="75" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.45s" fill="freeze"/>    +#######+.          .+#######:</text>
        <text x="0" y="90" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.7s" fill="freeze"/>   *######*:    .##.    :*######*:</text>
        <text x="0" y="105" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.95s" fill="freeze"/>  .######+.    *####*    .+######.</text>
        <text x="0" y="120" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/>  :######:    ########    :######:</text>
        <text x="0" y="135" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.45s" fill="freeze"/>  :######:    ########    :######:</text>
        <text x="0" y="150" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.7s" fill="freeze"/>  .######+.     ####     .+######.</text>
        <text x="0" y="165" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.95s" fill="freeze"/>   *######*:     ..     :*######*:</text>
        <text x="0" y="180" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.2s" fill="freeze"/>    +#######:.        .:#######+.</text>
        <text x="0" y="195" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.45s" fill="freeze"/>     :############################:</text>
        <text x="0" y="210" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.7s" fill="freeze"/>       =########################=</text>
        <text x="0" y="225" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.95s" fill="freeze"/>         :+################+:</text>
        <text x="0" y="240" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.2s" fill="freeze"/>            '-::::::::::-' </text>
      </g>
      <g font-family="monospace" font-size="13" fill="#475569">
        <text x="10" y="335">&gt; initializing profile...</text>
        <text x="10" y="356">&gt; status: <tspan fill="#10B981">ONLINE</tspan></text>
        <text x="10" y="377">&gt; mode: <tspan fill="#22D3EE">BUILD</tspan><tspan fill="#7C3AED">_CREATE</tspan></text>
      </g>
      <rect x="10" y="395" width="210" height="1" fill="url(#accent)" opacity=".5"/>
    </g>

    <!-- Terminal -->
    <g transform="translate(350 64)">
      <rect x="0" y="0" width="790" height="480" rx="22" fill="url(#panel)" stroke="#0F172A" stroke-opacity=".08"/>
      <rect x="1" y="1" width="788" height="478" rx="21" fill="none" stroke="url(#accent)" stroke-opacity=".35">
        <animate attributeName="stroke-opacity" values=".18;.55;.18" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="790" height="58" rx="22" fill="#0F172A" fill-opacity=".025"/>
      <circle cx="28" cy="29" r="5.5" fill="#7C3AED"/><circle cx="47" cy="29" r="5.5" fill="#22D3EE"/><circle cx="66" cy="29" r="5.5" fill="#10B981"/>
      <text x="735" y="34" text-anchor="end" font-family="monospace" font-size="12" fill="#64748B">~/profile</text>
      <rect x="22" y="57" width="746" height="1" fill="#fff" fill-opacity=".06"/>

      <g font-family="monospace">
        <text x="30" y="100" font-size="25" font-weight="700" fill="#0F172A">Hi 👋 I'm <tspan fill="url(#accent)">KRISH BHUSHAN</tspan><tspan fill="#22D3EE">|</tspan>
          <animate attributeName="opacity" values="0;1" dur=".7s" begin=".3s" fill="freeze"/>
        </text>
        <g fill="#475569" font-size="14">
          <text x="30" y="132">&gt; <tspan fill="#22D3EE">Frontend Engineer</tspan></text>
          <text x="30" y="157">&gt; <tspan fill="#7C3AED">Full Stack Developer</tspan></text>
          <text x="30" y="182">&gt; <tspan fill="#10B981">Open Source Contributor</tspan></text>
          <text x="30" y="207">&gt; <tspan fill="#22D3EE">UI Engineer</tspan></text>
          <text x="30" y="232">&gt; <tspan fill="#7C3AED">AI Enthusiast</tspan><tspan fill="#22D3EE">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
        </g>

        <line x1="30" y1="254" x2="760" y2="254" stroke="#0F172A" stroke-opacity=".07"/>

        <g font-size="13" fill="#475569">
          <text x="30" y="282"><tspan fill="#22D3EE">⌖</tspan> India</text>
          <text x="30" y="307"><tspan fill="#7C3AED">◇</tspan> B.Tech · Computer Science</text>
          <text x="30" y="332"><tspan fill="#10B981">◉</tspan> Building scalable web apps</text>
          <text x="30" y="357"><tspan fill="#22D3EE">↗</tspan> github.com/krishbhushancg</text>
          <text x="30" y="382"><tspan fill="#7C3AED">@</tspan> krishbhushancg@users.noreply.github.com</text>
        </g>

        <line x1="30" y1="405" x2="760" y2="405" stroke="#0F172A" stroke-opacity=".07"/>
        <text x="30" y="432" font-size="14" font-weight="700" fill="#0F172A">&lt;/&gt; Skills</text>

        <g font-size="12" fill="#334155">
          <g><rect x="30" y="447" width="80" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#22D3EE" stroke-opacity=".45"/><text x="70" y="465" text-anchor="middle">React</text></g>
          <g><rect x="118" y="447" width="88" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#7C3AED" stroke-opacity=".45"/><text x="162" y="465" text-anchor="middle">Next.js</text></g>
          <g><rect x="214" y="447" width="88" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#10B981" stroke-opacity=".45"/><text x="258" y="465" text-anchor="middle">Node.js</text></g>
          <g><rect x="310" y="447" width="105" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#22D3EE" stroke-opacity=".45"/><text x="362" y="465" text-anchor="middle">TypeScript</text></g>
          <g><rect x="423" y="447" width="91" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#7C3AED" stroke-opacity=".45"/><text x="468" y="465" text-anchor="middle">Tailwind</text></g>
          <g><rect x="522" y="447" width="76" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#10B981" stroke-opacity=".45"/><text x="560" y="465" text-anchor="middle">Python</text></g>
          <g><rect x="606" y="447" width="76" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#22D3EE" stroke-opacity=".45"/><text x="644" y="465" text-anchor="middle">Docker</text></g>
          <g><rect x="690" y="447" width="78" height="27" rx="13.5" fill="#0F172A" fill-opacity=".025" stroke="#7C3AED" stroke-opacity=".45"/><text x="729" y="465" text-anchor="middle">Postgres</text></g>
        </g>
      </g>
    </g>

    <!-- Scanline -->
    <rect x="30" y="-40" width="1120" height="2" fill="url(#accent)" opacity=".22" filter="url(#soft)">
      <animate attributeName="y" from="-40" to="620" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Reflection -->
    <rect x="0" y="0" width="1180" height="90" fill="#0F172A" opacity=".018" transform="skewY(-3)">
      <animateTransform attributeName="transform" type="translate" values="-80 0;80 0;-80 0" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
